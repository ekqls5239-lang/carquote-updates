name: KS v1.0.46 final release staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-v46-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: AD0436CB37E2797F01B237FC79F40C916E594F51F9376F82B80D9F0C176ED644
      EXPECTED_UPDATER_SHA: B273799152F5F5762872180DF6C28B55F7D5852A4AE3EAF511596D5D1B9B0A00
    steps:
      - name: Fetch verified v46 release candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          gh release download v1.0.46-rc1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'CarQuoteManager.exe' --pattern 'Updater.exe' --pattern 'SHA256.txt' \
            --dir verified
          test -s verified/CarQuoteManager.exe
          test -s verified/Updater.exe
          test -s verified/SHA256.txt
      - name: Independently verify SHA256 and Windows PE header
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          paths={
            'CarQuoteManager.exe':os.environ['EXPECTED_MAIN_SHA'],
            'Updater.exe':os.environ['EXPECTED_UPDATER_SHA'],
          }
          manifest=Path('verified/SHA256.txt').read_text(encoding='utf-8-sig')
          for name,expected in paths.items():
              p=Path('verified')/name
              with p.open('rb') as f:
                  assert f.read(2)==b'MZ', f'Invalid Windows EXE: {name}'
              with p.open('rb') as f:
                  sha=hashlib.file_digest(f,'sha256').hexdigest().upper()
              assert sha==expected, f'{name} SHA mismatch: {sha}'
              assert name in manifest and expected in manifest, f'Manifest mismatch: {name}'
              print(f'PASS {name}: {sha} ({p.stat().st_size} bytes)')
          PY
      - name: Stage v1.0.46 tagged release for atomic DB activation
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.46 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to replace existing v1.0.46 release'
            exit 1
          fi
          cat > release-notes.txt <<'EOF'
          KS오토트레이딩 중고차 견적 관리 프로그램 v1.0.46
          기존 v1.0.45의 화면 디자인과 입력 필드 유지.
          드롭다운 항목 간격 복원, 광고 문의 장부 초기 동기화 개선,
          견적함 실행 시 오늘 날짜 자동 선택, 송금방 계약금 송금 문구 개선.
          Nuitka EXE Windows 시작 검사 및 SHA-256 검증 통과.
          직원 PC 설치/업데이트 전 미동기화 견적은 동기화 상태를 확인하십시오.
          EOF
          gh release create v1.0.46 \
            verified/CarQuoteManager.exe verified/Updater.exe verified/SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target main --prerelease \
            --title 'KS오토트레이딩 46빌드 (v1.0.46)' \
            --notes-file release-notes.txt
          gh release view v1.0.46 --repo "$GITHUB_REPOSITORY"
